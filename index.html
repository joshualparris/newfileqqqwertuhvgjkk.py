<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Random Music / Podcast Redirect</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7ff;color:#111827;padding:24px}
    main{width:min(560px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.08);text-align:center}
    h1{margin:0 0 8px;font-size:22px}
    p{margin:0;color:#4b5563;line-height:1.5}
    .box{margin-top:14px;text-align:left;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:14px;word-break:break-word}
    .btn{display:inline-block;margin-top:12px;background:#2563eb;color:#fff;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <main id="app" aria-live="polite">
    <h1 id="title">Picking something…</h1>
    <p id="msg">Redirecting you to a random link.</p>
  </main>

  <script>
    // Add/remove links here. Each page load picks ONE at random and redirects.
    // Debug mode: add ?debug=1 to your URL to preview instead of redirecting.
    const LINKS = [
      // Spotify tracks (canonical, no extra params)
      "https://open.spotify.com/track/3Y7fpFZbHLpAvWJJYGehz0", // Follow the Sun — Xavier Rudd
      "https://open.spotify.com/track/1bzymgL9lQBAYNhJIXlNNG", // Woodland — The Paper Kites
      "https://open.spotify.com/track/5sIpifr43qTdWgphA9caLK", // Create in Me a Clean Heart — Keith Green
      "https://open.spotify.com/track/0KkaDIqlaaymAdFZiwptnh", // I Love the Rain — Claudia Robin Gunn
      "https://open.spotify.com/track/6ErL8Rpua0u3p71FrvyGjF", // Good Good Father
      "https://open.spotify.com/track/13Nn3hJ8JZq6dWHk2v62ai", // O Come to the Altar
      "https://open.spotify.com/track/7lE9AsH8YADFeykexnXK4u", // Jesus Strong and Kind
      "https://open.spotify.com/track/5ZEekTUdIRdPf9V8QP2or5", // Psalm 91
      "https://open.spotify.com/track/59tcQJiHwApzE4h6yVnL9i", // Ocean — John Butler
      "https://open.spotify.com/track/0V3wPSX9ygBnCm8psDIegu", // Anti-Hero — Taylor Swift

      // YouTube Music links (as provided; they’ll open YouTube Music)
      "https://music.youtube.com/watch?v=3jMbSENuoTA", // Open the Eyes of My Heart
      "https://music.youtube.com/watch?v=cu4f8zXC-yY", // Goodness of God
      "https://music.youtube.com/watch?v=YdgoG8hTMUw", // Banana Pancakes
      "https://music.youtube.com/watch?v=EWBGcNb9F5c", // Further Along
      "https://music.youtube.com/watch?v=-XHXUqXV34w", // Who Am I
      "https://music.youtube.com/watch?v=B8ks0CjeSc8", // It Is Well with My Soul

      // Spotify podcast episodes (canonical)
      "https://open.spotify.com/episode/6ku2bwRjJDt3xmo0Q04kkv", // Joe Rogan — Brett Weinstein
      "https://open.spotify.com/episode/3bmClppHUtmdEljLa6P1YO", // Modern Wisdom — School of Life
      "https://open.spotify.com/episode/0zrPQJBDLRQSCIa9NvJEXr", // Brené Brown
      "https://open.spotify.com/episode/2LGv8RMDUztRYTC9chzB2N"  // Matthew McConaughey
    ];

    const params = new URLSearchParams(location.search);
    const debug = params.get("debug") === "1";

    function pickRandom(arr){
      const clean = arr.filter(x => typeof x === "string" && x.trim().length);
      if (!clean.length) return null;
      return clean[Math.floor(Math.random() * clean.length)];
    }

    const chosen = pickRandom(LINKS);
    const app = document.getElementById("app");
    const title = document.getElementById("title");
    const msg = document.getElementById("msg");

    if (!chosen){
      title.textContent = "No links configured";
      msg.textContent = "Edit the LINKS array in index.html and add some URLs.";
    } else if (debug){
      title.textContent = "Debug mode (no auto redirect)";
      msg.textContent = "Here’s the link that would have been chosen:";
      const box = document.createElement("div");
      box.className = "box";
      box.innerHTML = `<a href="${chosen}" target="_blank" rel="noopener">${chosen}</a>`;
      app.appendChild(box);

      const a = document.createElement("a");
      a.className = "btn";
      a.href = chosen;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "Open it";
      app.appendChild(a);
    } else {
      title.textContent = "Redirecting…";
      msg.textContent = "Sending you to a random song/podcast now.";
      location.replace(chosen);
    }
  </script>
</body>
</html>
